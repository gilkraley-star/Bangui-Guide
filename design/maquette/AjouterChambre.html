<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142A52"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Bangui Guide — Ajouter une chambre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#F7F8FB;overscroll-behavior:none}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{display:none;width:0;height:0}
  a{text-decoration:none;color:inherit}
  *{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,opacity .2s ease,background-color .2s ease}
  a:active,button:active{transform:scale(.95)}
  a:hover,button:hover{filter:brightness(1.03)}
  x-dc>div{animation:bgFadeIn .38s cubic-bezier(.16,1,.3,1) both}
  @keyframes bgFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .stagger>*{animation:fadeInUp .45s cubic-bezier(.16,1,.3,1) both}
  .stagger>*:nth-child(1){animation-delay:.03s} .stagger>*:nth-child(2){animation-delay:.08s} .stagger>*:nth-child(3){animation-delay:.13s} .stagger>*:nth-child(4){animation-delay:.18s} .stagger>*:nth-child(5){animation-delay:.23s}
  input::placeholder{color:#B4B9C9}
  label{display:block;font-size:12.5px;font-weight:600;color:#3A3F52;margin-bottom:7px}
  .field{width:100%;box-sizing:border-box;background:#F7F8FB;border:1px solid transparent;border-radius:12px;padding:13px 14px;font-size:14px;color:#142A52;outline:none}
</style>
</head><body>


<div style="width:100%;height:100dvh;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:none;padding:20px 20px 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #ECEEF2">
    <a href="EditChambres.html" aria-label="Annuler" style="width:38px;height:38px;border-radius:11px;background:#F1F2F6;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#142A52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <span style="font-size:15px;font-weight:700;color:#142A52;font-family:'Space Grotesk',sans-serif">Modifier une chambre</span>
  </div>

  <div class="stagger" style="flex:1;overflow-y:auto;padding:22px 20px 24px;display:flex;flex-direction:column;gap:20px">

    <div>
      <label>Photo de la chambre</label>
      <button style="width:100%;height:140px;border:2px dashed #E7E9F0;border-radius:16px;background:#F7F8FB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A90A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <span style="font-size:12.5px;color:#8A90A3;font-weight:600">Ajouter une photo</span>
      </button>
    </div>

    <div>
      <label for="room-name">Nom de la chambre</label>
      <input id="room-name" class="field" type="text" value="Suite Présidentielle" placeholder="Ex : Chambre Standard">
    </div>

    <div>
      <label for="room-desc">Description (optionnel)</label>
      <input id="room-desc" class="field" type="text" value="Lit king size, vue sur jardin, climatisation" placeholder="Ex : Lit king size, climatisation">
    </div>

    <div>
      <label for="room-price">Prix par nuit (FCFA)</label>
      <input id="room-price" class="field" type="text" value="75 000" placeholder="Ex : 25 000">
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#F7F8FB;border-radius:14px">
      <div>
        <div style="font-size:13.5px;font-weight:600;color:#142A52">Disponible</div>
        <div style="font-size:11.5px;color:#8A90A3;margin-top:2px">Marquer « complet » si plus aucune chambre de ce type n'est libre</div>
      </div>
      <div style="width:44px;height:26px;border-radius:13px;background:#E7E9F0;flex:none;position:relative">
        <div style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#FFFFFF"></div>
      </div>
    </div>

  </div>

  <div style="flex:none;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid #ECEEF2;background:#FFFFFF;display:flex;gap:10px">
    <button style="flex:1;padding:14px;border-radius:14px;background:#FFF1F0;color:#C23B3B;font-size:14px;font-weight:700;border:none;cursor:pointer">Supprimer</button>
    <a href="EditChambres.html" style="flex:2;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:14px;background:#E2541F;color:#FFFFFF;font-size:14.5px;font-weight:700">Enregistrer</a>
  </div>

</div>

<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body></html>
