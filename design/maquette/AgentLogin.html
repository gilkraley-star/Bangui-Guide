<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142A52"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Bangui Guide — Connexion agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#F7F8FB;overscroll-behavior:none}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{display:none;width:0;height:0}
  a{text-decoration:none;color:inherit}
  *{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,opacity .2s ease,background-color .2s ease}
  a:active,button:active{transform:scale(.95)}
  a:hover,button:hover{filter:brightness(1.03)}
  x-dc>div{animation:bgFadeIn .38s cubic-bezier(.16,1,.3,1) both}
  @keyframes bgFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
  .stagger>*{animation:fadeInUp .45s cubic-bezier(.16,1,.3,1) both}
  .stagger>*:nth-child(1){animation-delay:.03s} .stagger>*:nth-child(2){animation-delay:.08s} .stagger>*:nth-child(3){animation-delay:.13s} .stagger>*:nth-child(4){animation-delay:.18s} .stagger>*:nth-child(5){animation-delay:.23s} .stagger>*:nth-child(6){animation-delay:.28s} .stagger>*:nth-child(7){animation-delay:.33s}
  .pulse-dot{animation:pulseDot 1.6s ease-in-out infinite}
  .hover-lift:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,42,82,.12)}
  input::placeholder{color:#B4B9C9}
</style>
</head><body>


<div style="width:100%;height:100dvh;box-sizing:border-box;background:#142A52;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:1;overflow-y:auto;padding:48px 24px 24px;display:flex;flex-direction:column">

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 34px">
      <img src="icons/logo.png" alt="Bangui Guide" style="height:52px;width:auto;border-radius:14px">
      <div style="text-align:center">
        <span style="font-size:10.5px;font-weight:700;color:#142A52;background:#F5841F;padding:4px 10px;border-radius:8px;letter-spacing:.3px">ESPACE AGENT TERRAIN</span>
        <h1 style="margin:10px 0 0;font-size:19px;font-weight:800;color:#FFFFFF;font-family:'Space Grotesk',sans-serif">Connexion agent</h1>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="background:rgba(255,255,255,.08);border-radius:13px;padding:13px 14px">
        <div style="font-size:10.5px;color:rgba(255,255,255,.6);margin-bottom:3px">Identifiant agent</div>
        <input type="text" placeholder="+236 72 00 00 00" style="border:none;outline:none;width:100%;font-size:13.5px;color:#FFFFFF;background:transparent">
      </div>
      <div style="background:rgba(255,255,255,.08);border-radius:13px;padding:13px 14px">
        <div style="font-size:10.5px;color:rgba(255,255,255,.6);margin-bottom:3px">Code PIN</div>
        <input type="password" placeholder="••••" style="border:none;outline:none;width:100%;font-size:13.5px;color:#FFFFFF;background:transparent">
      </div>

      <a href="AgentDashboard.html" style="display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;padding:14px;border-radius:14px;background:#E2541F;color:#FFFFFF;font-size:14.5px;font-weight:700;margin-top:8px">
        Se connecter
      </a>
    </div>

    <div style="flex:1"></div>

    <div style="display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin-top:20px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 2v6M12 22v-6M4.9 4.9l4.2 4.2M19.1 19.1l-4.2-4.2M2 12h6M22 12h-6M4.9 19.1l4.2-4.2M19.1 4.9l-4.2 4.2"/></svg>
      <span style="font-size:11.5px;color:rgba(255,255,255,.75);line-height:1.4">Les lieux saisis sans réseau restent enregistrés sur votre téléphone et se synchronisent automatiquement dès que la connexion revient.</span>
    </div>
    <p style="margin:14px 0 0;font-size:11px;color:rgba(255,255,255,.45);text-align:center">Comptes agents créés uniquement par l'administrateur Bangui Guide</p>

  </div>
</div>

<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body></html>
