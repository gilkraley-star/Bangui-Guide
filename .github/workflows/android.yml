name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Permissions Android (localisation, appareil photo, réseau)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA; do grep -q "android.permission.$p" $f || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $f; done
          grep -n "uses-permission" $f
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BanguiGuide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
