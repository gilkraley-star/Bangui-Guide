<style>html,body{margin:0;padding:0;background:#F7F8FB;overscroll-behavior:none}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

<div style="width:100%;height:100dvh;box-sizing:border-box;background:#F7F8FB;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:1;overflow-y:auto;padding:28px 20px 24px;display:flex;flex-direction:column">

    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 24px">

      <h1 style="margin:0;font-size:19px;font-weight:800;color:#142A52;font-family:'Space Grotesk',sans-serif">Demande envoyée</h1>

    <div style="flex:1"></div>

      <a href="Home.html" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:14px;border-radius:14px;background:#F1F2F6;color:#142A52;font-size:14.5px;font-weight:700">
