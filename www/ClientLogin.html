<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142A52"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Bangui Guide — Connexion client</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#F7F8FB;overscroll-behavior:none}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{display:none;width:0;height:0}
  a{text-decoration:none;color:inherit}
  *{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,opacity .2s ease,background-color .2s ease}
  a:active,button:active{transform:scale(.95)}
  a:hover,button:hover{filter:brightness(1.03)}
  x-dc>div{animation:bgFadeIn .38s cubic-bezier(.16,1,.3,1) both}
  @keyframes bgFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
  .stagger>*{animation:fadeInUp .45s cubic-bezier(.16,1,.3,1) both}
  .stagger>*:nth-child(1){animation-delay:.03s} .stagger>*:nth-child(2){animation-delay:.08s} .stagger>*:nth-child(3){animation-delay:.13s} .stagger>*:nth-child(4){animation-delay:.18s} .stagger>*:nth-child(5){animation-delay:.23s} .stagger>*:nth-child(6){animation-delay:.28s} .stagger>*:nth-child(7){animation-delay:.33s}
  .pulse-dot{animation:pulseDot 1.6s ease-in-out infinite}
  .hover-lift:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,42,82,.12)}
  input::placeholder{color:#B4B9C9}
</style>
</head><body>


<div style="width:100%;height:100dvh;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:none;padding:20px 20px 0">
    <a href="Home.html" aria-label="Retour" style="width:38px;height:38px;border-radius:11px;background:#F1F2F6;display:flex;align-items:center;justify-content:center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#142A52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>

  <div style="flex:1;overflow-y:auto;padding:28px 24px 24px;display:flex;flex-direction:column">

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 30px">
      <img src="icons/logo.png" alt="Bangui Guide" style="height:52px;width:auto;border-radius:14px">
      <div style="text-align:center">
        <h1 style="margin:0;font-size:19px;font-weight:800;color:#142A52;font-family:'Space Grotesk',sans-serif">Espace client</h1>
        <p style="margin:6px 0 0;font-size:13px;color:#8A90A3;line-height:1.4;max-width:260px">Connectez-vous avec le numéro utilisé lors de la création de votre fiche par l'agent Bangui Guide.</p>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="background:#F7F8FB;border-radius:13px;padding:13px 14px">
        <div style="font-size:10.5px;color:#8A90A3;margin-bottom:3px">Numéro de téléphone</div>
        <input type="text" placeholder="+236 70 00 00 00" style="border:none;outline:none;width:100%;font-size:13.5px;color:#142A52;background:transparent">
      </div>

      <a href="#" style="display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;padding:14px;border-radius:14px;background:#E2541F;color:#FFFFFF;font-size:14.5px;font-weight:700;margin-top:4px">
        Recevoir un code par SMS
      </a>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-top:20px">
      <div style="font-size:10.5px;color:#8A90A3;text-align:center;margin-bottom:2px">Code reçu par SMS</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <div style="width:44px;height:52px;border-radius:11px;background:#F7F8FB;border:1.5px solid #E2541F;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#142A52">4</div>
        <div style="width:44px;height:52px;border-radius:11px;background:#F7F8FB;border:1.5px solid #E7E9F0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#142A52">2</div>
        <div style="width:44px;height:52px;border-radius:11px;background:#F7F8FB;border:1.5px solid #E7E9F0;display:flex;align-items:center;justify-content:center"></div>
        <div style="width:44px;height:52px;border-radius:11px;background:#F7F8FB;border:1.5px solid #E7E9F0;display:flex;align-items:center;justify-content:center"></div>
      </div>
    </div>

    <div style="flex:1"></div>

    <a href="CompteClient.html" style="display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;padding:14px;border-radius:14px;background:#142A52;color:#FFFFFF;font-size:14.5px;font-weight:700;margin-top:18px">
      Valider le code
    </a>
    <p style="margin:14px 0 0;font-size:11.5px;color:#8A90A3;text-align:center;line-height:1.4">Pas encore de fiche ? Un agent Bangui Guide peut enregistrer votre établissement sur le terrain.</p>

  </div>
</div>

<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body></html>
